name: Integration

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # nightly
  workflow_dispatch:

jobs:
  web:
    name: Example integration test (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          install-chromedriver: true
      - name: Start chromedriver
        run: |
          ${{ steps.chrome.outputs.chromedriver-path }} --port=4444 &
          sleep 2
      - name: Run
        working-directory: example
        run: |
          flutter pub get
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/photo_flow_test.dart \
            -d web-server --browser-name=chrome --web-browser-flag=--headless=new

  linux:
    name: Example integration test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Run
        working-directory: example
        run: |
          flutter pub get
          xvfb-run flutter test integration_test -d linux
