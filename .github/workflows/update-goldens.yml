name: Update goldens

# Regenerates the golden images on Linux (where they are compared) and opens
# a pull request with the result. Run it from the Actions tab on any branch.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --tags golden --update-goldens
      - uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: test/goldens/
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: update-goldens/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          commit-message: Update golden images
          title: Update golden images
          body: Golden images regenerated on Linux by the Update goldens workflow.
          add-paths: test/goldens/*.png
