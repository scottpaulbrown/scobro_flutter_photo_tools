name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze and test (Flutter ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stable
            version: ''
            latest: true
          - name: '3.27'
            version: '3.27.x'
            latest: false
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter --version
      - name: Get packages
        run: |
          flutter pub get
          (cd example && flutter pub get)
      - name: Check formatting
        if: matrix.latest
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze (strict)
        if: matrix.latest
        run: |
          flutter analyze --fatal-infos
          (cd example && flutter analyze --fatal-infos)
      - name: Analyze
        if: ${{ !matrix.latest }}
        run: |
          flutter analyze
          (cd example && flutter analyze)
      - name: Test
        run: flutter test --coverage --exclude-tags golden
      - name: Coverage gate (90% of lib/)
        run: dart run tool/coverage_gate.dart --min 90
      - name: Example tests
        run: cd example && flutter test
      - name: Upload coverage to Codecov
        if: matrix.latest
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  goldens:
    name: Golden tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --tags golden
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/

  downgrade:
    name: Lowest dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.x'
          cache: true
      - run: flutter pub downgrade
      - run: flutter analyze
      - run: flutter test --exclude-tags golden

  pana:
    name: pana score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install WebP tools (screenshot checks)
        run: sudo apt-get update && sudo apt-get install -y webp
      - run: flutter pub get
      - run: dart pub global activate pana
      # Any lost point fails the build. Note: file_picker 11.x currently costs
      # points (WASM and up-to-date checks); see .planning/PLAN.md, P8.
      - run: dart pub global run pana --exit-code-threshold 0 --no-warning .

  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub publish --dry-run

  example-builds:
    name: Build example (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            os: ubuntu-latest
            build: flutter build web
          - target: linux
            os: ubuntu-latest
            build: flutter build linux
          - target: apk
            os: ubuntu-latest
            build: flutter build apk --debug
          - target: windows
            os: windows-latest
            build: flutter build windows
          - target: macos
            os: macos-latest
            build: flutter build macos
          - target: ios
            os: macos-latest
            build: flutter build ios --no-codesign
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: example
        run: |
          flutter pub get
          ${{ matrix.build }}
