name: Publish to pub.dev

# Publishes when a version tag such as v0.1.1 is pushed, using pub.dev's
# OIDC automated publishing (no stored secrets). Requires automated
# publishing to be enabled for this repo on pub.dev, with the tag pattern
# v{{version}} and the "pub.dev" GitHub environment.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Sets up the OIDC token that pub uses to authenticate.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter pub publish --force
