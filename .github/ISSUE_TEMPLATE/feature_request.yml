name: Feature request
description: Suggest something the package should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, in your app's terms.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you'd like it to work. API sketches are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
